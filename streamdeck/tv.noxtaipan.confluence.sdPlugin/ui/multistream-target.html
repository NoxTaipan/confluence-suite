<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			body {
				font-family: -apple-system, "Segoe UI", sans-serif;
				font-size: 12px;
				color: #d8d8d8;
				background: #2d2d2d;
				margin: 0;
				padding: 8px 16px;
			}
			.row {
				display: flex;
				align-items: center;
				gap: 10px;
				margin-bottom: 10px;
			}
			.row label {
				flex: 0 0 90px;
				opacity: 0.75;
			}
			.row select,
			.row input {
				flex: 1;
				background: #1f1f1f;
				color: inherit;
				border: 1px solid #444;
				border-radius: 4px;
				padding: 5px 6px;
				font-size: 12px;
			}
			.hint {
				font-size: 10px;
				opacity: 0.6;
				margin: -4px 0 10px 100px;
			}
			hr {
				border: none;
				border-top: 1px solid #444;
				margin: 14px 0;
			}
		</style>
	</head>
	<body>
		<div class="row">
			<label>Target</label>
			<select id="targetName"></select>
		</div>
		<div class="hint" id="targetHint">Cargando targets desde OBS...</div>

		<div class="row">
			<label>Accion</label>
			<select id="mode">
				<option value="toggle">Alternar</option>
				<option value="start">Arrancar</option>
				<option value="stop">Parar</option>
			</select>
		</div>

		<hr />

		<div class="row">
			<label>obs-websocket</label>
			<input type="text" id="obsHost" placeholder="127.0.0.1" />
		</div>
		<div class="row">
			<label>Puerto</label>
			<input type="text" id="obsPort" placeholder="4455" />
		</div>
		<div class="row">
			<label>Password</label>
			<input type="password" id="obsPassword" />
		</div>
		<div class="row">
			<label></label>
			<button type="button" id="testConn">Probar conexión</button>
		</div>
		<div class="row">
			<label></label>
			<div id="connStatus" style="font-size: 11px; line-height: 1.4"></div>
		</div>

		<script>
			let websocket = null;
			let uuid = null;
			let actionUUID = null;
			let settings = {};

			function connectElgatoStreamDeckSocket(inPort, inPropertyInspectorUUID, inRegisterEvent, inInfo, inActionInfo) {
				uuid = inPropertyInspectorUUID;
				const actionInfo = JSON.parse(inActionInfo);
				actionUUID = actionInfo.action;
				settings = actionInfo.payload.settings || {};

				websocket = new WebSocket("ws://127.0.0.1:" + inPort);

				websocket.onopen = () => {
					websocket.send(JSON.stringify({ event: inRegisterEvent, uuid }));
					websocket.send(JSON.stringify({ event: "getGlobalSettings", context: uuid }));

					document.getElementById("mode").value = settings.mode || "toggle";
					document.getElementById("targetName").dataset.pending = settings.targetName || "";
				};

				websocket.onmessage = (evt) => {
					const msg = JSON.parse(evt.data);
					if (msg.event === "didReceiveGlobalSettings") {
						const g = msg.payload.settings || {};
						document.getElementById("obsHost").value = g.obsHost || "";
						document.getElementById("obsPort").value = g.obsPort || "";
						document.getElementById("obsPassword").value = g.obsPassword || "";
					} else if (msg.event === "sendToPropertyInspector" && msg.payload && msg.payload.event === "targets") {
						populateTargets(msg.payload.targets, msg.payload.error);
					} else if (msg.event === "sendToPropertyInspector" && msg.payload && msg.payload.event === "connection") {
						const status = document.getElementById("connStatus");
						status.textContent = msg.payload.message;
						status.style.color = msg.payload.ok ? "#45d9a0" : "#ff7a7a";
						document.getElementById("testConn").disabled = false;
					}
				};
			}

			function populateTargets(targets, error) {
				const select = document.getElementById("targetName");
				const pending = select.dataset.pending || "";
				const hint = document.getElementById("targetHint");
				select.innerHTML = "";

				if (error || !targets || targets.length === 0) {
					hint.textContent = error
						? "No se pudo conectar a obs-websocket - revisa host/puerto/password abajo."
						: "OBS no tiene targets configurados todavia.";
					if (pending) {
						const opt = document.createElement("option");
						opt.value = pending;
						opt.textContent = pending + " (no encontrado)";
						select.appendChild(opt);
					}
					return;
				}

				hint.textContent = "";
				targets.forEach((t) => {
					const opt = document.createElement("option");
					opt.value = t.name;
					opt.textContent = t.name;
					select.appendChild(opt);
				});

				const match = [...select.options].some((o) => o.value === pending);
				if (match) {
					select.value = pending;
				} else {
					select.value = select.options[0].value;
					saveSetting("targetName", select.value);
				}
			}

			function saveSetting(key, value) {
				settings[key] = value;
				websocket.send(JSON.stringify({ event: "setSettings", context: uuid, payload: settings }));
			}

			function saveGlobalSetting(key, value) {
				const g = {
					obsHost: document.getElementById("obsHost").value,
					obsPort: document.getElementById("obsPort").value,
					obsPassword: document.getElementById("obsPassword").value
				};
				g[key] = value;
				websocket.send(JSON.stringify({ event: "setGlobalSettings", context: uuid, payload: g }));
			}

			document.addEventListener("DOMContentLoaded", () => {
				document.getElementById("targetName").addEventListener("change", (e) => saveSetting("targetName", e.target.value));
				document.getElementById("mode").addEventListener("change", (e) => saveSetting("mode", e.target.value));
				document.getElementById("obsHost").addEventListener("change", (e) => saveGlobalSetting("obsHost", e.target.value));
				document.getElementById("obsPort").addEventListener("change", (e) => saveGlobalSetting("obsPort", e.target.value));
				document.getElementById("obsPassword").addEventListener("change", (e) => saveGlobalSetting("obsPassword", e.target.value));
				document.getElementById("testConn").addEventListener("click", () => {
					const status = document.getElementById("connStatus");
					status.style.color = "";
					status.textContent = "Conectando...";
					document.getElementById("testConn").disabled = true;
					// Se guarda lo escrito y se prueba con eso mismo.
					saveGlobalSetting("obsHost", document.getElementById("obsHost").value);
					websocket.send(JSON.stringify({
						event: "sendToPlugin",
						context: uuid,
						action: actionUUID,
						payload: {
							event: "testConnection",
							obsHost: document.getElementById("obsHost").value,
							obsPort: document.getElementById("obsPort").value,
							obsPassword: document.getElementById("obsPassword").value
						}
					}));
				});
			});
		</script>
	</body>
</html>
